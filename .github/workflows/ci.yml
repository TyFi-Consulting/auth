name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TyFi.Auth.sln

      - name: Build
        run: dotnet build TyFi.Auth.sln -c Release --no-restore

      - name: Test
        run: dotnet test TyFi.Auth.sln -c Release --no-build --verbosity normal
